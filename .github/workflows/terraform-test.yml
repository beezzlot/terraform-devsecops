name: Terraform Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checkov:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: |
          checkov -d . --framework terraform -o json > test-results/checkov.json || true
          checkov -d . --framework terraform

      - name: Upload Checkov results
        uses: actions/upload-artifact@v4
        with:
          name: checkov-results
          path: test-results/checkov.json

  terratest:
    name: Terratest Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Install Terratest dependencies
        working-directory: tests/terratest
        run: |
          go mod download
          go mod tidy

      - name: Run Terratest
        working-directory: tests/terratest
        run: |
          mkdir -p ../../test-results
          go test -v -timeout 30m 2>&1 | tee ../../test-results/terratest.log

      - name: Upload Terratest results
        uses: actions/upload-artifact@v4
        with:
          name: terratest-results
          path: test-results/terratest.log

  report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: [checkov, terratest]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Checkov results
        uses: actions/download-artifact@v4
        with:
          name: checkov-results
          path: test-results/

      - name: Download Terratest results
        uses: actions/download-artifact@v4
        with:
          name: terratest-results
          path: test-results/

      - name: Display test summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checkov Results" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat test-results/checkov.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Terratest Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-results/terratest.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY