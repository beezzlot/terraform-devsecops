name: Terraform Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov Security Scan
    runs-on: ubuntu-latest

    environment: YC

    env:
      YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
      YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
      YC_TOKEN: ${{ secrets.YC_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: pip install checkov

      - name: Prepare test results directory
        run: mkdir -p test-results

      - name: Run Checkov
        run: |
          checkov -d . --framework terraform -o json \
            > test-results/checkov.json || true

          checkov -d . --framework terraform

      - name: Upload Checkov results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-results
          path: test-results/checkov.json
          if-no-files-found: error

  terratest:
    name: Terratest Integration Tests
    runs-on: ubuntu-latest

    environment: YC

    env:
      YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
      YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
      YC_TOKEN: ${{ secrets.YC_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: tests/terratest/go.sum

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"
          terraform_wrapper: false

      - name: Check Yandex Cloud secrets
        shell: bash
        run: |
          test -n "$YC_CLOUD_ID" || {
            echo "YC_CLOUD_ID is not set"
            exit 1
          }

          test -n "$YC_FOLDER_ID" || {
            echo "YC_FOLDER_ID is not set"
            exit 1
          }

          test -n "$YC_TOKEN" || {
            echo "YC_TOKEN is not set"
            exit 1
          }

          echo "Yandex Cloud secrets are available"

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -var-file=terraform.tfvars.dev

      - name: Install Terratest dependencies
        working-directory: tests/terratest
        run: |
          go mod tidy
          go mod download
          go mod verify

      - name: Run Terratest
        working-directory: tests/terratest
        run: |
          mkdir -p ../../test-results

          go test -v -timeout 30m 2>&1 | \
            tee ../../test-results/terratest.log

      - name: Upload Terratest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terratest-results
          path: test-results/terratest.log
          if-no-files-found: error

  report:
    name: Test Report
    runs-on: ubuntu-latest

    needs:
      - checkov
      - terratest

    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Checkov results
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: checkov-results
          path: test-results/checkov

      - name: Download Terratest results
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: terratest-results
          path: test-results/terratest

      - name: Display test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Test Results Summary"
            echo

            echo "### Checkov Results"
            if [ -f test-results/checkov/checkov.json ]; then
              echo '```json'
              cat test-results/checkov/checkov.json
              echo '```'
            else
              echo "Checkov result file is missing."
            fi

            echo

            echo "### Terratest Results"
            if [ -f test-results/terratest/terratest.log ]; then
              echo '```text'
              cat test-results/terratest/terratest.log
              echo '```'
            else
              echo "Terratest result file is missing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
